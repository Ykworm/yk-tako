<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tako · 架构与数据流</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa; --panel:#fff; --line:#e7e5e4; --line-soft:#f1f0ee;
  --ink:#18181b; --ink2:#52525b; --muted:#a1a1aa;
  --accent:#0f9d76;
  --c-fe:#3b82f6; --c-api:#0ea5e9; --c-eng:#f59e0b; --c-md:#8b5cf6; --c-st:#10b981;
  --f-request:#2563eb; --f-frame:#d97706; --f-tool:#0891b2; --f-finalize:#059669;
  --f-memory:#7c3aed; --f-orch:#db2777; --f-recover:#dc2626; --f-fs:#64748b; --f-event:#0d9488;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Outfit','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:14.5px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- header ---------- */
.hd{
  position:sticky; top:0; z-index:40;
  background:rgba(250,250,250,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:16px 24px; display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap;
}
.brandbar{display:flex; align-items:center; gap:14px}
.brandmark{display:block; flex:none}
.kicker{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#BB7738; font-weight:600; font-family:'JetBrains Mono',monospace}
.hd h1{font-size:27px; line-height:1.25; margin:4px 0 0; font-weight:600; letter-spacing:-.01em}
.lede{margin:6px 0 0; color:var(--ink2); max-width:70ch; font-size:14px}
.hd-r{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-top:6px}
.btn{
  font:inherit; font-size:13px; font-weight:500; color:var(--ink2);
  background:var(--panel); border:1px solid var(--line); border-radius:9px;
  padding:7px 13px; cursor:pointer; transition:all .18s ease; white-space:nowrap;
}
.btn:hover{border-color:#d6d3d1; color:var(--ink); transform:translateY(-1px); box-shadow:0 4px 14px -4px rgba(0,0,0,.1)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn-primary:hover{background:#0b8a66; border-color:#0b8a66; color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:216px minmax(0,1fr) 348px; gap:0; align-items:stretch}
.rail{border-right:1px solid var(--line); padding:18px 16px 40px; background:var(--panel)}
.rail-sec{margin-bottom:22px}
.rail-sec h3{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 9px; font-family:'JetBrains Mono',monospace}
.ck{display:flex; align-items:center; gap:8px; padding:3.5px 0; cursor:pointer; font-size:13.5px; color:var(--ink2); user-select:none}
.ck:hover{color:var(--ink)}
.ck input{accent-color:var(--accent); width:14px; height:14px; cursor:pointer}
.sw{width:9px; height:9px; border-radius:2.5px; background:var(--c); flex:none}
.rail input[type=text]{
  width:100%; font:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--bg); color:var(--ink);
}
.rail input[type=text]:focus{outline:none; border-color:var(--accent); background:#fff}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:0; font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; color:var(--ink2); font-family:'JetBrains Mono',monospace; font-size:11.5px; text-align:right}

/* ---------- stage ---------- */
.stage{position:relative; overflow:hidden; background:
  radial-gradient(circle at 1px 1px, #e7e5e4 1px, transparent 0) 0 0/22px 22px, var(--bg);}
.stage-top{position:absolute; top:10px; left:14px; right:14px; z-index:5; display:flex; justify-content:space-between; pointer-events:none}
.hint{font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; background:rgba(255,255,255,.75); padding:3px 8px; border-radius:6px}
.zoomctl{pointer-events:auto; display:flex; gap:4px; align-items:center; background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:8px; padding:3px}
.zoomctl button{border:0; background:transparent; cursor:pointer; font:inherit; font-size:14px; color:var(--ink2); width:24px; height:22px; border-radius:5px}
.zoomctl button:hover{background:var(--line-soft); color:var(--ink)}
.zoomctl span{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); min-width:38px; text-align:center}
#cv{width:100%; height:calc(100vh - 118px); min-height:560px; display:block; cursor:grab}
#cv.drag{cursor:grabbing}
.legend{position:absolute; bottom:12px; left:14px; z-index:5; display:flex; gap:14px; flex-wrap:wrap;
  background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:9px; padding:7px 12px; font-size:11.5px; color:var(--ink2)}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:16px; height:2.5px; border-radius:2px; background:var(--c); display:inline-block}

/* ---------- svg ---------- */
.band{fill:#fff; stroke:var(--line); stroke-width:1; rx:14}
.band-title{font-size:14px; font-weight:600; fill:var(--ink)}
.band-sub{font-size:10.5px; fill:var(--muted); font-family:'JetBrains Mono',monospace}
.lane-label{font-size:10.5px; fill:var(--muted); font-family:'JetBrains Mono',monospace; letter-spacing:.06em}
.node rect{stroke-width:1.25; transition:opacity .2s ease}
.node text{pointer-events:none}
.n-name{font-size:13.5px; font-weight:600; fill:var(--ink)}
.n-sub{font-size:10.5px; fill:var(--muted); font-family:'JetBrains Mono',monospace}
.n-line{font-size:11.5px; fill:var(--ink2); font-family:'JetBrains Mono',monospace}
.node{cursor:pointer}
.node:hover .n-name{fill:var(--accent)}
.edge{fill:none; stroke-width:1.6; transition:opacity .2s ease, stroke-width .2s ease}
.edge-label{
  font-size:10px; font-family:'JetBrains Mono',monospace; fill:var(--ink2);
  pointer-events:none; opacity:0; transition:opacity .2s ease;
  paint-order:stroke; stroke:#fafafa; stroke-width:3.5px; stroke-linejoin:round;
}
.edge-label.show{opacity:.92}
.edge.dim{opacity:.10}
.node.dim{opacity:.22}
.edge.hot{stroke-width:2.6; opacity:1}
.edge-label.hot{opacity:1; font-weight:500}
.edge.live{stroke-width:3.2; opacity:1}
.node.live rect{stroke-width:2.4}
.dimmed{opacity:.18}
.pulse{opacity:0}

/* ---------- detail ---------- */
.detail{border-left:1px solid var(--line); background:var(--panel); padding:18px 18px 44px; overflow-y:auto; max-height:calc(100vh - 118px)}
.detail h2{font-size:17px; margin:0 0 2px; font-weight:600; line-height:1.3}
.detail .dsub{font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-bottom:12px}
.detail h4{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; font-family:'JetBrains Mono',monospace}
.detail p{margin:0 0 8px; color:var(--ink2); font-size:13.5px}
.code{display:flex; flex-direction:column; gap:3px}
.code a{display:block; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink2);
  background:var(--bg); border:1px solid var(--line-soft); border-radius:6px; padding:4px 8px; text-decoration:none}
.code a:hover{border-color:var(--accent); color:var(--accent)}
.facts{margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:12.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0; color:var(--ink2)}
.flowlist{margin:0; padding:0; list-style:none; font-size:12.5px}
.flowlist li{padding:4px 0; border-bottom:1px dashed var(--line); color:var(--ink2); display:flex; gap:7px}
.flowlist li:last-child{border-bottom:0}
.flowlist .dot{width:7px; height:7px; border-radius:2px; background:var(--c); flex:none; margin-top:7px}
.docs{margin:0; padding:0; list-style:none; font-size:12.5px}
.docs li{padding:3px 0}
.docs span{color:var(--ink2)}
.docs i{color:var(--muted); font-style:normal; font-family:'JetBrains Mono',monospace; font-size:11px; display:block}
.tag{display:inline-block; font-size:10.5px; font-family:'JetBrains Mono',monospace; padding:2px 7px; border-radius:20px;
  background:color-mix(in srgb, var(--c) 12%, transparent); color:var(--c); border:1px solid color-mix(in srgb, var(--c) 28%, transparent)}
.empty{color:var(--muted); font-size:13px}
.empty ul{margin:8px 0 0; padding-left:18px}
.empty li{margin-bottom:4px}

/* ---------- step list ---------- */
.steps{margin:0; padding:0; list-style:none; counter-reset:s}
.steps li{
  counter-increment:s; font-size:12.5px; color:var(--ink2); padding:5px 0 5px 26px; position:relative;
  border-bottom:1px solid var(--line-soft); cursor:pointer;
}
.steps li::before{content:counter(s); position:absolute; left:0; top:5px; width:17px; height:17px; border-radius:50%;
  border:1.5px solid var(--line); font-size:9.5px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-family:'JetBrains Mono',monospace}
.steps li.on::before{background:var(--accent); border-color:var(--accent); color:#fff}
.steps li.on{color:var(--ink); font-weight:500}
.steps li.done::before{background:#e6f5ef; border-color:var(--accent); color:var(--accent)}
.steps li:hover{color:var(--ink)}

/* ---------- notes ---------- */
.notes{max-width:1180px; margin:0 auto; padding:44px 24px 80px}
.notes h2{font-size:23px; font-weight:600; margin:44px 0 6px; letter-spacing:-.01em}
.notes h2:first-child{margin-top:0}
.notes .sub{color:var(--ink2); margin:0 0 18px; max-width:74ch}
.cardgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(268px,1fr)); gap:14px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 2px 8px rgba(0,0,0,.035)}
.card h3{font-size:14.5px; margin:0 0 6px; font-weight:600; display:flex; align-items:center; gap:7px}
.card p{margin:0; font-size:13px; color:var(--ink2)}
.card code{font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--line-soft); padding:1px 5px; border-radius:4px; color:var(--ink)}
table{width:100%; border-collapse:collapse; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-family:'JetBrains Mono',monospace; font-weight:500; background:var(--bg)}
tr:last-child td{border-bottom:0}
td code{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink2)}
.foot{margin-top:36px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
.foot code{font-family:'JetBrains Mono',monospace; font-size:11.5px}
/* ---------- poster 模式：只留画布，给无头 Chrome 导出 4K 海报 ---------- */
body.poster{background:#FCFAF6}
body.poster .hd,body.poster .rail,body.poster .detail,body.poster .notes,
body.poster .stage-top,body.poster .legend{display:none!important}
body.poster .shell{display:block}
body.poster .stage{overflow:hidden;background:#FCFAF6}
body.poster #cv{width:100vw;height:100vh;min-height:0}
body.poster .n-name,body.poster .n-sub,body.poster .n-line,body.poster .lane-label,
body.poster .band-title,body.poster .band-sub{ /* 海报里字要清楚 */ }
@media(max-width:1180px){ .shell{grid-template-columns:186px minmax(0,1fr) 300px} }
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{border-right:0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:18px}
  .detail{border-left:0; border-top:1px solid var(--line); max-height:none}
  #cv{height:70vh}
}
</style>
</head>

</svg><span class="kicker">运行引擎架构与数据流</span></div>
    <h1>一场 run 从用户指尖到历史落库的完整链路</h1>
    <p class="lede">点节点看它是什么、代码落在哪；点连线看这条数据流什么时候发生、带了什么、落到哪。或按「播放数据流」看一场真实 run 的生命周期怎么一步步走完。</p>

      <h3>规模</h3>

        <dt>引擎底座</dt><dd>Eino ADK</dd>
      </dl>

    <section class="rail-sec">
      <h3>怎么读</h3>

function anchorOf(n,side,frac){
  frac = frac==null? .5 : frac;
  if(side==='bottom') return {x:n.x+n.w*frac, y:n.y+n.h};
  if(side==='top')    return {x:n.x+n.w*frac, y:n.y};
  if(side==='right')  return {x:n.x+n.w, y:n.y+n.h*.5};
  return {x:n.x, y:n.y+n.h*.5};
}
function pathFor(e){
  const A=N[e.f].n, B=N[e.t].n;
  let side='down';
  if(e.side==='lat') side='lat';
  else if(B.y + B.h <= A.y) side='up';
  else if(B.y >= A.y + A.h) side='down';
  else side='lat';

  let f, t, d;
  if(e.route==='left'){
    f={x:A.x, y:A.y+A.h*(e.sy==null?.5:e.sy)};
    t={x:B.x, y:B.y+B.h*(e.ty==null?.5:e.ty)};
    d=`M${f.x},${f.y} C${e.ch},${f.y} ${e.ch},${t.y} ${t.x},${t.y}`;
    return {d,f,t};
  }
  if(e.route==='right'){
    f={x:A.x+A.w, y:A.y+A.h*.5};
    t={x:B.x+B.w, y:B.y+B.h*.5};
    d=`M${f.x},${f.y} C${e.ch},${f.y} ${e.ch},${t.y} ${t.x},${t.y}`;
    return {d,f,t};
  }
  if(side==='down'){
    f=anchorOf(A,'bottom',e.fx); t=anchorOf(B,'top',e.tx);
    const dy=t.y-f.y;
    d=`M${f.x},${f.y} C${f.x},${f.y+dy*.45} ${t.x},${t.y-dy*.45} ${t.x},${t.y}`;
  } else if(side==='up'){
    f=anchorOf(A,'top',e.fx); t=anchorOf(B,'bottom',e.tx);
    const dy=t.y-f.y;
    d=`M${f.x},${f.y} C${f.x},${f.y+dy*.45} ${t.x},${t.y-dy*.45} ${t.x},${t.y}`;
  } else {
    const rightward = (B.x+B.w/2) > (A.x+A.w/2);
    f=anchorOf(A, rightward?'right':'left', .5); t=anchorOf(B, rightward?'left':'right', .5);
    const dx=t.x-f.x;
    d=`M${f.x},${f.y} C${f.x+dx*.45},${f.y} ${t.x-dx*.45},${t.y} ${t.x},${t.y}`;
  }
  return {d,f,t};
}

EDGES.forEach(e=>{

    'stroke-dasharray':e.dash?'6 4':'', 'marker-end':'url(#ah)'});
  if(e.bidir) p.setAttribute('marker-start','url(#ah)');
  g.appendChild(p);
  const mid=el('path',{class:'edge',d:geo.d,stroke:'transparent','stroke-width':14,fill:'none'});
  g.appendChild(mid);
  gEdges.appendChild(g);
  const lab=el('text',{class:'edge-label','data-edge':e.id,x:0,y:0,fill:col,'text-anchor':'middle'});
  lab.textContent=e.short||e.label;
  if(e.primary) lab.classList.add('show');
  gLabels.appendChild(lab);
  E[e.id]={g,p,lab,geo,e};
  // 标签落点：默认取曲线真实中点；密集处用 labXY / labAt 手动挪开
  try{
    const L=p.getTotalLength();

    if(e.labXY){lab.setAttribute('x',e.labXY[0]); lab.setAttribute('y',e.labXY[1]);}
    else {lab.setAttribute('x',pt.x); lab.setAttribute('y',pt.y-3);}
  }catch(err){
    lab.setAttribute('x',(geo.f.x+geo.t.x)/2); lab.setAttribute('y',(geo.f.y+geo.t.y)/2-3);
  }
  mid.addEventListener('click',ev=>{ev.stopPropagation(); selectEdge(e.id);});

  Object.keys(E).forEach(id=>{
    const e=E[id].e;

    const ly = layerOn[N[e.f].n.layer] && layerOn[N[e.t].n.layer];
    E[id].g.style.display = (fl&&ly)?'':'none';
    E[id].lab.style.display = (fl&&ly)?'':'none';
  });
}

/* =========================================================================
   交互：选中 / 悬停隔离 / 搜索
   ========================================================================= */
const detail=document.getElementById('detail');
let sel=null;

function upstreamOf(id){return EDGES.filter(e=>e.t===id).map(e=>e.f);}
function downstreamOf(id){return EDGES.filter(e=>e.f===id).map(e=>e.t);}
function nodeById(id){return N[id]?N[id].n:null;}

function escapeHTML(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function selectNode(id){
  sel={type:'node',id};
  const n=nodeById(id); if(!n) return;
  const up=upstreamOf(id), dn=downstreamOf(id);
  const upS=[...new Set(up)].map(u=>nodeById(u)).filter(Boolean);
  const dnS=[...new Set(dn)].map(u=>nodeById(u)).filter(Boolean);
  const layer=LAYERS.find(L=>L.id===n.layer);
  let h='<h2>'+escapeHTML(n.name)+'</h2><div class="dsub">'+escapeHTML(layer?layer.name+' · '+layer.sub:'')+(n.sub?' · '+escapeHTML(n.sub):'')+'</div>';
  h+='<p>'+escapeHTML(n.what)+'</p>';
  h+='<h4>在数据流里</h4><p>'+escapeHTML(n.role)+'</p>';
  if(n.facts&&n.facts.length){
    h+='<h4>关键事实</h4><dl class="facts">';
    n.facts.forEach(f=>{h+='<dt>'+escapeHTML(f[0])+'</dt><dd>'+escapeHTML(f[1])+'</dd>';});
    h+='</dl>';
  }
  if(n.code&&n.code.length){
    h+='<h4>代码落点</h4><div class="code">';
    n.code.forEach(c=>{h+='<a>'+escapeHTML(c)+'</a>';});
    h+='</div>';
  }
  h+='<h4>上游</h4>'+ (upS.length? '<ul class="flowlist">'+upS.map(u=>'<li><span class="dot" style="--c:'+(layer?layer.color:'#999')+'"></span>'+escapeHTML(u.name)+'</li>').join('')+'</ul>' : '<div class="empty">无（入口节点）</div>');
  h+='<h4>下游</h4>'+ (dnS.length? '<ul class="flowlist">'+dnS.map(u=>'<li><span class="dot" style="--c:'+(layer?layer.color:'#999')+'"></span>'+escapeHTML(u.name)+'</li>').join('')+'</ul>' : '<div class="empty">无（终点节点）</div>');
  if(n.docs&&n.docs.length){
    h+='<h4>真源文档</h4><ul class="docs">';
    n.docs.forEach(d=>{h+='<li><span>'+escapeHTML(d[0])+'</span><i>'+escapeHTML(d[1])+'</i></li>';});
    h+='</ul>';
  }
  detail.innerHTML=h;
  Object.keys(E).forEach(k=>setLabel(k,'short'));
  highlightSel();
}

function selectEdge(id){
  sel={type:'edge',id};
  const e=E[id].e;
  const F=FLOWS[e.flow];
  const A=nodeById(e.f), B=nodeById(e.t);
  let h='<h2>'+escapeHTML(A.name)+' → '+escapeHTML(B.name)+'</h2>';
  h+='<div class="dsub"><span class="tag" style="--c:'+F.c+'">'+F.n+'</span></div>';
  h+='<h4>这条流带的是什么</h4><p>'+escapeHTML(e.label)+'</p>';
  h+='<h4>从哪到哪</h4><dl class="facts"><dt>起点</dt><dd>'+escapeHTML(A.name)+'</dd><dt>终点</dt><dd>'+escapeHTML(B.name)+'</dd><dt>方向</dt><dd>'+(e.bidir?'双向（一次往返：调用与结果）':'单向')+'</dd></dl>';
  const rel=STEPS.filter(s=>s.e===id);
  if(rel.length){
    h+='<h4>在生命周期里的位置</h4>';
    rel.forEach(s=>{h+='<p><strong>'+escapeHTML(s.title)+'</strong>：'+escapeHTML(s.text)+'</p>';});
  }
  detail.innerHTML=h;
  setLabel(id,'full');
  highlightSel();
}

function highlightSel(){
  Object.keys(E).forEach(id=>{E[id].p.classList.remove('live');E[id].lab.classList.remove('hot');});
  Object.keys(N).forEach(id=>{N[id].g.classList.remove('live');});
  if(!sel) return;
  if(sel.type==='node'){
    N[sel.id].g.classList.add('live');
    EDGES.filter(e=>e.f===sel.id||e.t===sel.id).forEach(e=>{E[e.id].p.classList.add('live');E[e.id].lab.classList.add('hot');});
  } else {
    E[sel.id].p.classList.add('live'); E[sel.id].lab.classList.add('hot');
    N[E[sel.id].e.f].g.classList.add('live'); N[E[sel.id].e.t].g.classList.add('live');
  }
}

function hoverNode(id){
  if(id){
    const keep=new Set([id]);
    EDGES.forEach(e=>{ if(e.f===id||e.t===id){keep.add(e.f);keep.add(e.t);} });
    Object.keys(N).forEach(k=>N[k].g.classList.toggle('dim',!keep.has(k)));
    Object.keys(E).forEach(k=>{
      const e=E[k].e, on=(e.f===id||e.t===id);
      E[k].p.classList.toggle('hot',on);
      E[k].lab.classList.toggle('hot',on);
      E[k].p.classList.toggle('dim',!on);
    });
  } else if(!sel){
    Object.keys(N).forEach(k=>N[k].g.classList.remove('dim'));
    Object.keys(E).forEach(k=>{E[k].p.classList.remove('dim');E[k].p.classList.remove('hot');E[k].lab.classList.remove('hot');});
  }
}
function hoverEdge(id){
  if(id){
    const e=E[id].e;
    E[id].p.classList.add('hot'); E[id].lab.classList.add('hot');
    setLabel(id,'full');
    [e.f,e.t].forEach(k=>N[k].g.classList.remove('dim'));
  } else {
    Object.keys(E).forEach(k=>{E[k].p.classList.remove('hot');E[k].lab.classList.remove('hot');});
    Object.keys(E).forEach(k=>setLabel(k,'short'));
    if(sel && sel.type==='edge') setLabel(sel.id,'full');
  }
}
/* 静默态只显示短标签；悬停 / 选中 / 演示到这一步时展开成完整描述（画布上截断，全文在右侧面板） */
function setLabel(id,mode){
  const e=E[id], s=e.e;
  let txt;
  if(mode==='full'){
    txt = s.label.length>46 ? s.label.slice(0,45)+'…' : s.label;
  } else {
    txt = s.short||s.label;
  }
  if(e.lab.textContent!==txt) e.lab.textContent=txt;
}

/* 搜索 */
document.getElementById('q').addEventListener('input',ev=>{
  const q=ev.target.value.trim().toLowerCase();
  if(!q){
    Object.keys(N).forEach(k=>N[k].g.classList.remove('dim'));
    Object.keys(E).forEach(k=>{E[k].p.classList.remove('dim');E[k].lab.classList.remove('hot');});
    return;
  }
  const hits=new Set();
  Object.keys(N).forEach(id=>{
    const n=N[id].n;
    const hay=[n.name,n.sub,n.what,n.role,(n.code||[]).join(' ')].join(' ').toLowerCase();
    if(hay.indexOf(q)>=0) hits.add(id);
  });
  Object.keys(N).forEach(k=>N[k].g.classList.toggle('dim',!hits.has(k)));
  Object.keys(E).forEach(k=>{
    const e=E[k].e, on=hits.has(e.f)||hits.has(e.t);
    E[k].p.classList.toggle('dim',!on);
    E[k].lab.classList.toggle('hot',on);
  });
});

let scale=1, tx=0, ty=0;
const cv=document.getElementById('cv');
function applyTransform(){ root.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`); document.getElementById('zval').textContent=Math.round(scale*100)+'%'; }
function zoomAt(cx,cy,factor){
  const ns=Math.min(3,Math.max(.35,scale*factor));
  const k=ns/scale;
  tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=ns; applyTransform();
}
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=cv.getBoundingClientRect();
  const px=(ev.clientX-r.left)/r.width*1470, py=(ev.clientY-r.top)/r.height*970;
  zoomAt(px,py, ev.deltaY<0?1.12:0.89);
},{passive:false});
let dragging=false,sx=0,sy=0,stx=0,sty=0;
cv.addEventListener('mousedown',ev=>{dragging=true;sx=ev.clientX;sy=ev.clientY;stx=tx;sty=ty;cv.classList.add('drag');});
window.addEventListener('mouseup',()=>{dragging=false;cv.classList.remove('drag');});
window.addEventListener('mousemove',ev=>{
  if(!dragging)return;
  const r=cv.getBoundingClientRect();
  tx=stx+(ev.clientX-sx)/r.width*1470; ty=sty+(ev.clientY-sy)/r.height*970; applyTransform();
});

document.getElementById('zout').addEventListener('click',()=>zoomAt(735,485,1/1.2));
document.getElementById('zfit').addEventListener('click',()=>{scale=1;tx=0;ty=0;applyTransform();});

/* =========================================================================
   演示播放
   ========================================================================= */
let step=0, playing=false, timer=null, raf=null;
const btnPlay=document.getElementById('play');
function renderStep(){
  const s=STEPS[step], e=E[s.e];
  sel={type:'edge',id:s.e};
  Object.keys(E).forEach(k=>{E[k].p.classList.remove('live');E[k].lab.classList.remove('hot');setLabel(k,'short');});
  Object.keys(N).forEach(k=>N[k].g.classList.remove('live'));
  e.p.classList.add('live'); e.lab.classList.add('hot'); setLabel(s.e,'full');
  N[e.e.f].g.classList.add('live'); N[e.e.t].g.classList.add('live');
  const A=nodeById(e.e.f), B=nodeById(e.e.t), F=FLOWS[e.e.flow];
  let h='<div class="dsub">第 '+(step+1)+' / '+STEPS.length+' 步 · <span class="tag" style="--c:'+F.c+'">'+F.n+'</span></div>';
  h+='<h2>'+escapeHTML(s.title)+'</h2><p>'+escapeHTML(s.text)+'</p>';
  h+='<h4>这一跳</h4><dl class="facts"><dt>从</dt><dd>'+escapeHTML(A.name)+'</dd><dt>到</dt><dd>'+escapeHTML(B.name)+'</dd><dt>带的东西</dt><dd>'+escapeHTML(e.e.label)+'</dd></dl>';
  h+='<h4>全部步骤</h4><ol class="steps">';
  STEPS.forEach((x,i)=>{
    h+='<li class="'+(i===step?'on':(i<step?'done':''))+'" data-i="'+i+'">'+escapeHTML(x.title)+'</li>';
  });
  h+='</ol>';
  detail.innerHTML=h;
  detail.querySelectorAll('.steps li').forEach(li=>{
    li.addEventListener('click',()=>{goStep(parseInt(li.dataset.i,10));});
  });
  document.getElementById('prev').disabled = step===0;
  document.getElementById('next').disabled = step===STEPS.length-1;
  animatePulse(e);
}
function animatePulse(e){
  if(raf) cancelAnimationFrame(raf);
  const path=e.p; const len=path.getTotalLength();
  const t0=performance.now(), dur=900;
  function frame(t){
    const k=Math.min(1,(t-t0)/dur);
    const pt=path.getPointAtLength(len*k);
    pulse.setAttribute('cx',pt.x); pulse.setAttribute('cy',pt.y);
    pulse.classList.remove('pulse');
    if(k<1) raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}
function goStep(i){
  step=Math.max(0,Math.min(STEPS.length-1,i));
  renderStep();
}
function play(){
  if(playing) return;
  playing=true; btnPlay.textContent='⏸ 暂停';
  if(step>=STEPS.length-1) step=0;
  renderStep();
  timer=setInterval(()=>{
    if(step>=STEPS.length-1){ stopPlay(); return; }
    goStep(step+1);
  },2600);
}
function stopPlay(){playing=false;btnPlay.textContent='▶ 播放数据流';if(timer){clearInterval(timer);timer=null;}}
btnPlay.addEventListener('click',()=>{playing?stopPlay():play();});
document.getElementById('next').addEventListener('click',()=>{stopPlay();goStep(step+1);});
document.getElementById('prev').addEventListener('click',()=>{stopPlay();goStep(step-1);});
document.getElementById('reset').addEventListener('click',()=>{
  stopPlay(); sel=null; step=0;
  Object.keys(E).forEach(k=>{E[k].p.classList.remove('live');E[k].lab.classList.remove('hot');E[k].p.classList.remove('dim');setLabel(k,'short');});
  Object.keys(N).forEach(k=>N[k].g.classList.remove('dim','live'));
  pulse.classList.add('pulse');
  detail.innerHTML=defaultDetail();
});

function defaultDetail(){

   '<p>有两种线特别值得注意：<br>· 往回拐的<b>长弯线</b>（左边缘那两条）是<b>回流</b>——定稿与召回从存储层回到引擎／页面；<br>· <b>虚线</b>是恢复链路（崩溃后续跑）。</p>'+
   '<p>点任意<b>节点</b>：看它是什么、代码落在哪、在链路里的位置、真源文档。<br>点任意<b>连线</b>：看这条流什么时候发生、带了什么。</p>'+
   '<h4>三个最容易记错的点</h4><ul style="font-size:13px;color:var(--ink2);padding-left:18px;margin:0">'+

}
