<h1 id="13--上下文压缩实施计划">13 · 上下文压缩实施计划</h1>
<blockquote>
<p>性质：实施台账。算法详见《12》第 9 节。每完成一项就把复选框改成已勾。</p>
</blockquote>
<p>完成的标准：对应代码和测试在，<code>cd yk-tako-eino &amp;&amp; gofmt -l .</code> 无输出，<code>go test ./...</code> 通过。</p>
<ul class="task-list">
<li><label><input type="checkbox" checked="" />T1 把《12》第 9 节写成可以照着实现的伪代码，并写明窗口文件、<code>/models</code> 查询和收尾时才改 <code>run_archive</code></label></li>
<li><label><input type="checkbox" checked="" />T2 <code>CountPrompt</code> / <code>CountMessages</code>：<code>cl100k_base</code>，有 <code>Usage.TotalTokens</code> 时只数后面的消息，没有时不加工具说明</label></li>
<li><label><input type="checkbox" checked="" />T3 窗口大小：进程内存，然后当前目录的 <code>model-windows.json</code>，然后 <code>GET /models</code>；256000 不写文件</label></li>
<li><label><input type="checkbox" checked="" />T4 <code>Plan</code>：80% 的进入和退出、<code>N</code> 从 20 降到 0、RAG 只检索一次、过不了就 <code>ErrStillOver</code> 且不 <code>Stage</code></label></li>
<li><label><input type="checkbox" checked="" />T5 <code>BeforeModelRewriteState</code> 注册在 <code>piiHandler</code> 前面；摘要是一次 <code>Generate</code>；返回的消息是新对象</label></li>
<li><label><input type="checkbox" checked="" />T6 发送前 <code>Stage</code> 只换 <code>modelMsgs</code>；<code>complete</code> 时和 <code>produced_json</code> 同一笔更新 <code>user_message</code> 并清空被换掉的行；失败则退回快照</label></li>
<li><label><input type="checkbox" checked="" />T7 <code>compact_rag</code> 写入、一次词重叠检索、工具 <code>search_archive</code>；写入失败只记日志</label></li>
<li><label><input type="checkbox" checked="" />T8 页面收到 kind 为 <code>compact</code> 的事件时显示正在压缩，不显示摘要正文</label></li>
<li><label><input type="checkbox" checked="" />T9 <code>gofmt</code>、<code>go test ./...</code> 通过，并同步《05》第 4 项的状态</label></li>
</ul>
