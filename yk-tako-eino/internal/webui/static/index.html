<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 空 favicon：避免浏览器请求 /favicon.ico 落进 404 日志 -->
<link rel="icon" href="data:,">
<title>yk-tako</title>
<style>
  /* ============ 主题变量：亮色 / 暗色跟随系统 ============ */
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e3e6ea;
    --text: #1b1f24;
    --muted: #7a828e;
    --accent: #0a7d4f;
    --accent-weak: #e6f4ec;
    --accent-ink: #ffffff;
    --warn: #9a6700;
    --warn-bg: #fff8e5;
    --warn-border: #f0d58c;
    --danger: #b42318;
    --danger-weak: #fdecea;
    --code-bg: #f2f3f5;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --panel: #171a1f;
      --panel-2: #1b1f25;
      --border: #2a2f36;
      --text: #e6e9ee;
      --muted: #98a1ac;
      --accent: #34c98d;
      --accent-weak: #14301f;
      --accent-ink: #06231a;
      --warn: #e2b93d;
      --warn-bg: #2a2410;
      --warn-border: #574a1c;
      --danger: #f97066;
      --danger-weak: #331b19;
      --code-bg: #1e2229;
      --shadow: 0 1px 2px rgba(0, 0, 0, .45);
    }
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.6 var(--sans);
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }
  button {
    font: inherit;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: filter .12s ease, background .12s ease;
  }
  button:hover:not(:disabled) { filter: brightness(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
  button.ghost { background: transparent; border-color: var(--border); color: var(--text); }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }

  /* ============ 顶栏 ============ */
  #topbar {
    flex: 0 0 auto;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .brand { font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  .brand .logo { margin-right: 2px; }
  #status {
    font-size: 12.5px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #status::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    flex: 0 0 auto;
  }
  #status.busy::before { background: var(--accent); animation: pulse 1s infinite; }
  #status.done::before { background: var(--accent); }
  #status.err::before { background: var(--danger); }
  .top-actions { margin-left: auto; display: flex; gap: 8px; }
  .top-actions button { padding: 6px 12px; font-size: 13px; }
  #btn-board { position: relative; }
  #btn-board.updated::after {
    content: "";
    position: absolute; top: 3px; right: 3px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }

  /* ============ 主区：左聊天 + 右看板 ============ */
  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #chat { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1 1 auto; overflow-y: auto; padding: 20px 20px 8px; scroll-behavior: smooth; }
  #log > * { max-width: 860px; margin-left: auto; margin-right: auto; }

  /* ============ 空态提示 ============ */
  .hint-block {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
  }
  .hint-block p { margin: 4px 0; }
  .hint-block code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }

  /* ============ 消息 ============ */
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .msg { margin: 14px 0; animation: rise .18s ease-out; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--accent-weak);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    padding: 9px 13px;
    max-width: 78%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.assistant .md { padding: 2px 2px 0; }

  /* 助手消息的极简 markdown 排版（渲染在 JS 里，节点全走 textContent，防注入） */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 8px 0; }
  .md h2, .md h3, .md h4 { margin: 16px 0 6px; line-height: 1.35; }
  .md h2 { font-size: 17px; }
  .md h3 { font-size: 15.5px; }
  .md h4 { font-size: 14.5px; }
  .md ul, .md ol { margin: 8px 0; padding-left: 24px; }
  .md li { margin: 3px 0; }
  .md code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 5px;
  }
  .md pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .md blockquote {
    margin: 8px 0;
    padding: 2px 0 2px 12px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .md a { color: var(--accent); }

  /* ============ 过程事件：工具调用 / 回执 / 备注 / 错误 ============ */
  .ev { margin: 9px 0; font-size: 13px; color: var(--muted); animation: rise .15s ease-out; }
  .ev .ico { margin-right: 6px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; }
  .chip {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
  }
  .ev .out {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 5.6em;
    overflow: hidden;
  }
  .ev .out.expanded { max-height: none; }
  .ev .toggle {
    margin-top: 4px;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    display: inline-block;
  }
  .ev.note { color: var(--muted); }
  .ev.error {
    color: var(--danger);
    background: var(--danger-weak);
    border: 1px solid var(--danger);
    border-radius: 10px;
    padding: 9px 12px;
  }

  /* 工作指示：始终钉在日志末尾，事件来了就把它顶下去 */
  .working { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .working-dots i {
    display: inline-block;
    width: 5px; height: 5px;
    margin: 0 1px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite;
  }
  .working-dots i:nth-child(2) { animation-delay: .15s; }
  .working-dots i:nth-child(3) { animation-delay: .3s; }

  /* ============ 审批卡片：贴在输入区上方，不用翻日志 ============ */
  #approval {
    flex: 0 0 auto;
    margin: 0 20px 10px;
    border: 1px solid var(--warn-border);
    background: var(--warn-bg);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    animation: rise .18s ease-out;
  }
  #approval .approval-head { font-weight: 700; color: var(--warn); }
  .approval-info { margin: 8px 0 12px; font-size: 13px; }
  .approval-info .row { display: flex; gap: 10px; margin: 4px 0; align-items: flex-start; }
  .approval-info .k { flex: 0 0 52px; color: var(--muted); }
  .approval-info .v { flex: 1 1 auto; word-break: break-word; }
  .approval-info .v.mono {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    white-space: pre-wrap;
  }
  .approval-actions { display: flex; gap: 10px; }
  .approval-actions .primary { background: var(--warn); color: #fff; border-color: transparent; }

  /* ============ 输入区 ============ */
  #composer {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding: 12px 20px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1 1 auto;
    resize: none;
    max-height: 160px;
    padding: 10px 12px;
    font: inherit;
    line-height: 1.5;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  #input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  #send, #stop { padding: 10px 18px; }

  /* ============ 看板面板 ============ */
  #board {
    flex: 0 0 320px;
    width: 320px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    min-height: 0;
  }
  .board-head {
    flex: 0 0 auto;
    padding: 14px 16px;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  .board-body { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px 20px; }
  .board-empty { color: var(--muted); font-size: 13px; }
  .board-receipt { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
  .board-title { font-weight: 600; font-size: 13px; margin: 10px 0 6px; }
  .board-task {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 7px 9px;
    margin: 6px 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 13px;
  }
  .board-task .tid { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .board-task.done { opacity: .62; }
  .board-task.done .subject { text-decoration: line-through; }
  .board-warn {
    margin-top: 12px;
    padding: 9px 11px;
    font-size: 12.5px;
    white-space: pre-wrap;
    color: var(--warn);
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 9px;
  }

  /* ============ 窄屏：看板变抽屉 ============ */
  @media (max-width: 900px) {
    #board {
      position: fixed;
      top: 52px;
      right: 0;
      bottom: 0;
      width: min(85vw, 360px);
      flex-basis: auto;
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: none;
      z-index: 30;
    }
    body.show-board #board { display: flex; }
    body.board-off #board { display: none; }
  }
  @media (min-width: 901px) {
    body.board-off #board { display: none; }
  }
</style>
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo">🐙</span>yk-tako</div>
    <div id="status">就绪</div>
    <div class="top-actions">
      <button id="btn-board" class="ghost" title="显示 / 隐藏任务看板">📋 看板</button>
      <button id="btn-new" class="ghost" title="换一个新会话（不继承当前上下文）">＋ 新会话</button>
    </div>
  </header>

  <main id="main">
    <section id="chat">
      <div id="log">
        <div id="empty-hint" class="hint-block">
          <p><strong>会话已就绪</strong>（ID：<code id="sid"></code>）。</p>
          <p>页面刷新不会重放旧消息，但会话上下文在服务端保留，接着聊即可；要彻底重开点右上角「＋ 新会话」。</p>
        </div>
      </div>

      <div id="approval" class="hidden" role="alertdialog" aria-live="assertive" aria-label="等待审批">
        <div class="approval-head">⏸️ 需要你的决定</div>
        <div id="approval-info" class="approval-info"></div>
        <div class="approval-actions">
          <button id="btn-approve" class="primary">批准执行</button>
          <button id="btn-reject" class="danger">拒绝</button>
        </div>
      </div>

      <form id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）" aria-label="输入消息"></textarea>
        <button id="send" class="primary" type="submit">发送</button>
        <button id="stop" class="danger hidden" type="button">停止</button>
      </form>
    </section>

    <aside id="board" aria-label="任务看板">
      <div class="board-head">📋 任务看板</div>
      <div id="board-body" class="board-body"><div class="board-empty">（暂无任务）</div></div>
    </aside>
  </main>

<script>
// ============ 会话与状态 ============
// 会话 id 存 localStorage：刷新页面不丢会话（服务端进程内存，重启即丢，《10》§4.4）。
let sessionId = localStorage.yktakoSession || (localStorage.yktakoSession = crypto.randomUUID());
const state = {
  busy: false,          // 是否有一轮在跑（与服务的 409 判定对应）
  pendingApproval: null,// 当前等待回执的审批请求 id
  deciding: false,      // 审批回执请求是否在途，防双击
  controller: null,     // 当前流式请求的 AbortController（停止键用）
};

const log = document.getElementById('log');
const boardBody = document.getElementById('board-body');
const approvalBox = document.getElementById('approval');
const approvalInfo = document.getElementById('approval-info');
const statusEl = document.getElementById('status');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
const btnBoard = document.getElementById('btn-board');
const emptyHint = document.getElementById('empty-hint');
document.getElementById('sid').textContent = sessionId.slice(0, 8);

// working 行是常驻元素：干活时显示并永远钉在日志末尾，事件一多它自然被顶上去。
const working = document.createElement('div');
working.className = 'ev working hidden';
working.innerHTML = '<span class="ico">🐙</span><span>正在工作</span><span class="working-dots"><i></i><i></i><i></i></span>';

// ============ 小工具 ============
// el 建元素：cls 为类名，text 走 textContent（模型内容永不进 innerHTML）。
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// 贴底判定要在追加节点之前取，追加后再按需滚。
function isNearBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
}
function append(node) {
  const stick = isNearBottom();
  log.appendChild(node);
  if (working.parentNode === log) log.appendChild(working); // working 永远保持在最底
  if (stick) log.scrollTop = log.scrollHeight;
}
function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || '';
}

// ============ 极简 markdown 渲染 ============
// 支持：代码围栏、# 标题、-/* 与 1. 列表、> 引用、**粗**、*斜*、`行内码`、[文字](http链接)。
// 所有节点用 textContent 赋值，不碰 innerHTML——模型输出即不可信输入。
function inlineNodes(text) {
  const nodes = [];
  const re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*)|(\[[^\]\n]+\]\(https?:\/\/[^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) nodes.push(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0];
    if (tok[0] === '`') {
      nodes.push(el('code', '', tok.slice(1, -1)));
    } else if (tok.startsWith('**')) {
      nodes.push(el('strong', '', tok.slice(2, -2)));
    } else if (tok[0] === '*') {
      nodes.push(el('em', '', tok.slice(1, -1)));
    } else {
      const parts = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(tok);
      const a = el('a', '', parts[1]);
      a.href = parts[2];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      nodes.push(a);
    }
    last = m.index + tok.length;
  }
  if (last < text.length) nodes.push(document.createTextNode(text.slice(last)));
  return nodes;
}

// renderMarkdown 逐行分块：代码围栏优先，其次标题/列表/引用/段落。
function renderMarkdown(text) {
  const frag = document.createDocumentFragment();
  const lines = text.split('\n');
  const fence = (l) => l.trim().startsWith('```');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (fence(line)) {
      const buf = [];
      i++;
      while (i < lines.length && !fence(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const pre = el('pre');
      pre.appendChild(el('code', '', buf.join('\n')));
      frag.appendChild(pre);
      continue;
    }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) {
      const heading = el('h' + Math.min(h[1].length + 1, 4));
      heading.append(...inlineNodes(h[2]));
      frag.appendChild(heading);
      i++;
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const ul = el('ul');
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        const li = el('li');
        li.append(...inlineNodes(lines[i].replace(/^\s*[-*]\s+/, '')));
        ul.appendChild(li);
        i++;
      }
      frag.appendChild(ul);
      continue;
    }
    if (/^\s*\d+[.、)]\s+/.test(line)) {
      const ol = el('ol');
      while (i < lines.length && /^\s*\d+[.、)]\s+/.test(lines[i])) {
        const li = el('li');
        li.append(...inlineNodes(lines[i].replace(/^\s*\d+[.、)]\s+/, '')));
        ol.appendChild(li);
        i++;
      }
      frag.appendChild(ol);
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      const quote = el('blockquote');
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      quote.append(...inlineNodes(buf.join('\n')));
      frag.appendChild(quote);
      continue;
    }
    if (line.trim() === '') { i++; continue; }
    // 普通段落：连续非空且非结构行合并；段内换行用 <br>。
    const buf = [line];
    i++;
    while (
      i < lines.length &&
      lines[i].trim() !== '' &&
      !fence(lines[i]) &&
      !/^(#{1,4})\s+/.test(lines[i]) &&
      !/^\s*[-*]\s+/.test(lines[i]) &&
      !/^\s*\d+[.、)]\s+/.test(lines[i]) &&
      !/^\s*>\s?/.test(lines[i])
    ) { buf.push(lines[i]); i++; }
    const p = el('p');
    buf.forEach((l, idx) => {
      if (idx) p.appendChild(document.createElement('br'));
      p.append(...inlineNodes(l));
    });
    frag.appendChild(p);
  }
  return frag;
}

// ============ 日志条目 ============
// 第一条真实内容进来时撤掉空态提示。
function dropEmptyHint() {
  if (emptyHint && emptyHint.parentNode) emptyHint.remove();
}
function appendUser(text) {
  dropEmptyHint();
  const wrap = el('div', 'msg user');
  wrap.appendChild(el('div', 'bubble', text));
  append(wrap);
}
function appendAssistant(text) {
  dropEmptyHint();
  const wrap = el('div', 'msg assistant');
  const md = el('div', 'md');
  md.appendChild(renderMarkdown(text));
  wrap.appendChild(md);
  append(wrap);
}
function appendToolCall(names) {
  dropEmptyHint();
  const row = el('div', 'ev');
  row.appendChild(el('span', 'ico', '→ 🔧'));
  const chips = el('span', 'chips');
  (names || []).forEach((n) => chips.appendChild(el('span', 'chip', n)));
  row.appendChild(chips);
  append(row);
}
function appendToolResult(name, text) {
  dropEmptyHint();
  const row = el('div', 'ev');
  row.appendChild(el('span', 'ico', '← 🔧'));
  row.appendChild(el('span', 'chip', name || '工具'));
  const out = el('div', 'out', text);
  row.appendChild(out);
  append(row);
  // 长回执折叠：溢出可视高度时给「展开」开关。
  requestAnimationFrame(() => {
    if (out.scrollHeight > out.clientHeight + 4) {
      const toggle = el('span', 'toggle', '展开');
      toggle.onclick = () => {
        out.classList.toggle('expanded');
        toggle.textContent = out.classList.contains('expanded') ? '收起' : '展开';
      };
      row.appendChild(toggle);
    }
  });
}
function appendNote(text) {
  dropEmptyHint();
  append(el('div', 'ev note', text));
}
function appendError(text) {
  dropEmptyHint();
  append(el('div', 'ev error', '出错了：' + text));
}

// ============ 看板渲染 ============
// 事件原文形如：回执 + 空行 + 「📋 任务看板（x/y 已完成）」+ 任务行 + 「⚠️ 催更块」。
// 只做分行样式化，不截断任何文本（《10》：看板原文 sink 不得截断）。
function renderBoard(text) {
  boardBody.textContent = '';
  const lines = String(text || '').split('\n');
  let warn = null;
  let title = null;
  lines.forEach((line) => {
    if (/^\s*[✅🔄⏳]\s*#/.test(line)) {
      const m = /^\s*([✅🔄⏳])\s*#(\S+)\s+(.*)$/.exec(line);
      const row = el('div', 'board-task' + (m[1] === '✅' ? ' done' : ''));
      row.appendChild(el('span', '', m[1]));
      row.appendChild(el('span', 'tid', '#' + m[2]));
      row.appendChild(el('span', 'subject', m[3]));
      (warn ? warn : boardBody).appendChild(row);
      return;
    }
    if (/^📋/.test(line)) { title = el('div', 'board-title', line); return; }
    if (/^⚠️/.test(line)) {
      warn = el('div', 'board-warn', line);
      return;
    }
    if (warn) { warn.textContent += '\n' + line; return; }
    if (line.trim() === '') return;
    const receipt = el('div', 'board-receipt', line);
    boardBody.appendChild(receipt);
  });
  if (title) boardBody.insertBefore(title, boardBody.firstChild);
  if (warn) boardBody.appendChild(warn);
  if (!boardBody.childNodes.length) boardBody.appendChild(el('div', 'board-empty', '（暂无任务）'));
  // 窄屏下看板是抽屉：没展开时给按钮加个提示点。
  if (window.matchMedia('(max-width: 900px)').matches && !document.body.classList.contains('show-board')) {
    btnBoard.classList.add('updated');
  }
}

// ============ 审批卡片 ============
function approvalRow(k, v, mono) {
  const row = el('div', 'row');
  row.appendChild(el('span', 'k', k));
  row.appendChild(el('span', 'v' + (mono ? ' mono' : ''), v));
  return row;
}
function showApproval(a) {
  state.pendingApproval = a.id;
  approvalInfo.textContent = '';
  approvalInfo.appendChild(approvalRow('工具', a.tool || '（未标注）'));
  approvalInfo.appendChild(approvalRow('参数', a.args || '—', true));
  if (a.message) approvalInfo.appendChild(approvalRow('说明', a.message));
  document.getElementById('btn-approve').disabled = false;
  document.getElementById('btn-reject').disabled = false;
  approvalBox.classList.remove('hidden');
}
async function decide(decision) {
  if (!state.pendingApproval || state.deciding) return;
  const requestId = state.pendingApproval;
  state.deciding = true;
  document.getElementById('btn-approve').disabled = true;
  document.getElementById('btn-reject').disabled = true;
  try {
    const resp = await fetch('/api/approval', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, requestId, decision }),
    });
    if (!resp.ok) {
      appendError('审批回执失败：' + resp.status + ' ' + (await resp.text()));
      document.getElementById('btn-approve').disabled = false;
      document.getElementById('btn-reject').disabled = false;
      return;
    }
    appendNote(decision === 'approve' ? '✅ 已批准，继续执行' : '🚫 已拒绝，模型会收到说明');
    state.pendingApproval = null;
    approvalBox.classList.add('hidden');
  } catch (e) {
    appendError('审批回执没发出去：' + e);
    document.getElementById('btn-approve').disabled = false;
    document.getElementById('btn-reject').disabled = false;
  } finally {
    state.deciding = false;
  }
}

// ============ 一轮对话 ============
function setBusy(busy) {
  state.busy = busy;
  sendBtn.disabled = busy;
  stopBtn.classList.toggle('hidden', !busy);
  if (busy) {
    setStatus('正在工作…', 'busy');
    dropEmptyHint();
    if (working.parentNode !== log) log.appendChild(working);
    working.classList.remove('hidden');
    if (isNearBottom()) log.scrollTop = log.scrollHeight;
  } else {
    working.classList.add('hidden');
    if (statusEl.classList.contains('busy')) setStatus('就绪');
  }
}
function renderEvent(ev) {
  switch (ev.kind) {
    case 'message': appendAssistant(ev.text); break;
    case 'tool_call': appendToolCall(ev.toolNames); break;
    case 'tool_result': appendToolResult(ev.toolName, ev.text); break;
    case 'board': renderBoard(ev.text); break;
    case 'approval': showApproval(ev.approval || {}); break;
    case 'error': appendError(ev.text); setStatus('出错了', 'err'); break;
  }
}
async function send() {
  const message = input.value.trim();
  if (!message || state.busy) return;
  input.value = '';
  input.style.height = 'auto';
  appendUser(message);
  setBusy(true);
  state.controller = new AbortController();
  let stopped = false;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message }),
      signal: state.controller.signal,
    });
    if (!resp.ok) {
      appendError('请求失败：' + resp.status + ' ' + (await resp.text()));
      setStatus('出错了', 'err');
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const line = frame.split('\n').find((l) => l.startsWith('data: '));
        if (line) {
          try { renderEvent(JSON.parse(line.slice(6))); } catch (e) { console.error(e); }
        }
      }
    }
    if (!statusEl.classList.contains('err')) setStatus('就绪', 'done');
  } catch (e) {
    if (e.name === 'AbortError') {
      stopped = true;
      appendNote('⏹️ 已停止：本轮作废，不会写入会话历史');
      setStatus('已停止');
    } else {
      appendError('连接断了：' + e);
      setStatus('连接断了', 'err');
    }
  } finally {
    state.controller = null;
    state.pendingApproval = null;
    approvalBox.classList.add('hidden');
    setBusy(false);
    if (stopped) setStatus('已停止');
  }
}

// ============ 入口交互 ============
document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  send();
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
stopBtn.addEventListener('click', () => {
  if (state.controller) state.controller.abort();
});
document.getElementById('btn-approve').onclick = () => decide('approve');
document.getElementById('btn-reject').onclick = () => decide('reject');
document.getElementById('btn-new').addEventListener('click', () => {
  if (state.busy && !confirm('有一轮正在跑，换新会话会中止它，继续吗？')) return;
  if (state.controller) state.controller.abort();
  sessionId = crypto.randomUUID();
  localStorage.yktakoSession = sessionId;
  document.getElementById('sid').textContent = sessionId.slice(0, 8);
  log.textContent = '';
  log.appendChild(working);
  boardBody.textContent = '';
  boardBody.appendChild(el('div', 'board-empty', '（暂无任务）'));
  approvalBox.classList.add('hidden');
  state.pendingApproval = null;
  appendNote('＋ 已开始新会话 ' + sessionId.slice(0, 8));
  setStatus('就绪');
  input.focus();
});
btnBoard.addEventListener('click', () => {
  const narrow = window.matchMedia('(max-width: 900px)').matches;
  if (narrow) {
    document.body.classList.toggle('show-board');
    if (document.body.classList.contains('show-board')) btnBoard.classList.remove('updated');
  } else {
    document.body.classList.toggle('board-off');
  }
});
input.focus();
</script>
