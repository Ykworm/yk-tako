<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- 空 favicon：避免浏览器请求 /favicon.ico 落进 404 日志 -->
<link rel="icon" href="data:,">
<title>yk-tako</title>
<style>
  /* 语义色，不写死在组件上。亮色是暖纸，暗色是暖炭；强调色只用于「正在进行」和链接。
     主按钮用墨色，保证两种主题下正文对比都过 4.5:1，不靠一块霓虹绿撑整个界面。 */
  :root {
    color-scheme: light;
    --bg: #f3f0e8;
    --surface: #fffcf7;
    --surface-2: #f6f2ea;
    --ink: #1c1915;
    --muted: #5c564e;
    --line: #e3dcd0;
    --accent: #0e6b56;
    --accent-soft: #e4f3ee;
    --warn: #8a4b08;
    --warn-fill: #8a4b08;
    --warn-ink: #fffaf3;
    --warn-bg: #fff5e6;
    --warn-line: #efd3a4;
    --danger: #9f1239;
    --danger-soft: #fde8ee;
    --code: #f3efe6;
    --shadow: 0 1px 2px rgba(40, 32, 22, .05), 0 16px 40px rgba(40, 32, 22, .06);
    --scrim: rgba(28, 25, 21, .46);
    --header-h: 56px;
    --measure: 42rem;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #12110f;
      --surface: #1c1b18;
      --surface-2: #242320;
      --ink: #f4f0e8;
      --muted: #c2b8aa;
      --line: #3a362f;
      --accent: #5dccab;
      --accent-soft: #16352c;
      --warn: #f0c14d;
      --warn-fill: #e8b84a;
      --warn-ink: #1c1408;
      --warn-bg: #2a2316;
      --warn-line: #5c4a22;
      --danger: #fb7185;
      --danger-soft: #3a1c24;
      --code: #26241f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .35);
      --scrim: rgba(0, 0, 0, .55);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.6 var(--sans);
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-soft); }
  .hidden { display: none !important; }
  button, textarea { font: inherit; color: inherit; }
  button {
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 10px;
    padding: 0 12px;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--surface-2); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary { background: var(--ink); color: var(--bg); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--ink); filter: brightness(1.12); }
  button.ghost { border-color: var(--line); background: var(--surface); }
  button.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); }
  .icon { width: 18px; height: 18px; flex: 0 0 auto; display: block; }
  .icon-btn { width: 36px; padding: 0; }

  /* ============ 顶栏 ============ */
  #topbar {
    flex: 0 0 auto;
    height: var(--header-h);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    z-index: 40;
    min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 650; letter-spacing: -.01em; }
  .mark {
    width: 28px; height: 28px; flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 8px;
    background: var(--ink);
    color: var(--bg);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: -.06em;
    line-height: 1;
  }
  .mark-lg { width: 48px; height: 48px; border-radius: 14px; font-size: 16px; }
  #status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    color: var(--muted);
    font-size: 13px;
  }
  #status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex: 0 0 auto;
  }
  #status.busy .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  #status.done .dot { background: var(--accent); }
  #status.err .dot { background: var(--danger); }
  #status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-actions { margin-left: auto; display: flex; gap: 8px; flex: 0 0 auto; }
  .narrow { display: none; }
  #btn-board { position: relative; }
  #btn-board.updated::after {
    content: "";
    position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--surface);
  }

  /* ============ 工作区 ============ */
  #workspace { flex: 1 1 auto; display: flex; min-height: 0; min-width: 0; }
  #chat { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #log {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 0;
    overflow-y: auto;
    padding: 28px 24px 12px;
    scroll-behavior: smooth;
  }
  #log > * { width: 100%; max-width: var(--measure); flex: 0 0 auto; min-width: 0; }
  .dock {
    flex: 0 0 auto;
    width: min(var(--measure), 100%);
    margin: 0 auto;
    padding: 0 24px calc(16px + env(safe-area-inset-bottom));
  }

  /* ============ 空态 ============ */
  .empty {
    margin-top: auto;
    margin-bottom: auto;
    padding: 8px 4px 32px;
  }
  .empty .mark { width: 44px; height: 44px; border-radius: 12px; margin-bottom: 16px; font-size: 15px; }
  .empty h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; font-weight: 650; }
  .empty p { margin: 0; color: var(--muted); max-width: 38em; }
  .hint-meta { margin-top: 14px !important; font-family: var(--mono); font-size: 12px; }

  /* ============ 消息 ============ */
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .msg { margin: 18px 0; animation: rise .2s var(--ease); }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px 16px 4px 16px;
    padding: 10px 14px;
    max-width: min(36em, 85%);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .who { color: var(--muted); font-size: 12px; }
  .msg .who { margin: 0 0 2px; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 8px 0; }
  .md h2, .md h3, .md h4 { margin: 18px 0 6px; line-height: 1.35; letter-spacing: -.015em; }
  .md h2 { font-size: 1.15rem; }
  .md h3 { font-size: 1.05rem; }
  .md h4 { font-size: 1rem; }
  .md ul, .md ol { margin: 8px 0; padding-left: 1.3em; }
  .md li { margin: 3px 0; }
  .md code {
    font-family: var(--mono);
    font-size: .86em;
    background: var(--code);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 5px;
  }
  .md pre {
    background: var(--code);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 12px 0;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .md blockquote {
    margin: 8px 0;
    padding: 2px 0 2px 12px;
    border-left: 3px solid var(--line);
    color: var(--muted);
  }
  .md a { color: var(--accent); text-underline-offset: 2px; }

  /* ============ 过程 ============ */
  .ev {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    padding: 2px 0 2px 12px;
    border-left: 2px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    animation: rise .16s var(--ease);
  }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .ev .out {
    flex: 1 1 100%;
    margin: 2px 0 0;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--code);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 5.6em;
    overflow: hidden;
  }
  .ev .out.expanded { max-height: none; }
  .ev .toggle {
    flex: 1 1 100%;
    justify-content: flex-start;
    min-height: 28px;
    padding: 0;
    color: var(--accent);
    font-size: 12px;
  }
  .ev .toggle:hover { background: transparent; text-decoration: underline; }
  .ev.error {
    color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    border-left-width: 3px;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .working-dots { display: inline-flex; gap: 3px; }
  .working-dots i {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  .working-dots i:nth-child(2) { animation-delay: .15s; }
  .working-dots i:nth-child(3) { animation-delay: .3s; }

  /* ============ 审批 ============ */
  /* 参数可能很长。卡片限高，详情区自己滚，批准/拒绝和输入栏留在视口里。 */
  #approval {
    display: flex;
    flex-direction: column;
    max-height: min(42dvh, 320px);
    margin-bottom: 10px;
    border: 1px solid var(--warn-line);
    background: var(--warn-bg);
    border-radius: 16px;
    padding: 14px 14px 12px;
    box-shadow: var(--shadow);
    animation: rise .2s var(--ease);
  }
  .approval-head { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; font-weight: 650; color: var(--warn); }
  .approval-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .approval-info { margin: 10px 0 12px; font-size: 13px; flex: 1 1 auto; min-height: 0; overflow: auto; }
  .approval-info .row { display: flex; gap: 10px; margin: 6px 0; align-items: flex-start; }
  .approval-info .k { flex: 0 0 40px; color: var(--muted); }
  .approval-info .v { flex: 1 1 auto; min-width: 0; word-break: break-word; }
  .approval-info .v.mono {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    white-space: pre-wrap;
  }
  .approval-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .approval-actions .primary { background: var(--warn-fill); color: var(--warn-ink); }
  .approval-actions .primary:hover:not(:disabled) { filter: brightness(1.08); }

  /* ============ 输入 ============ */
  #composer { display: block; }
  .composer-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-width: 0;
    padding: 8px 8px 8px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  .composer-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #input {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    resize: none;
    max-height: 160px;
    padding: 8px 0;
    line-height: 1.5;
    border: 0;
    background: transparent;
  }
  #input:focus { outline: none; }
  #send, #stop { flex: 0 0 auto; min-height: 36px; border-radius: 12px; }

  /* ============ 看板 ============ */
  #board {
    flex: 0 0 320px;
    width: 320px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--line);
    min-height: 0;
  }
  .board-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .board-head h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
  .board-body { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px 24px; }
  .board-empty { color: var(--muted); font-size: 13px; }
  .board-receipt { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .board-meta { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .board-task {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 8px;
    align-items: baseline;
    padding: 8px 10px;
    margin: 6px 0;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
  }
  .state {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .02em;
    border-radius: 999px;
    padding: 1px 6px;
  }
  .state.done { color: var(--accent); background: var(--accent-soft); }
  .state.run { color: var(--warn); background: var(--warn-bg); }
  .state.wait { color: var(--muted); background: var(--code); }
  .board-task .tid { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .board-task.done .subject { color: var(--muted); text-decoration: line-through; }
  .board-warn {
    margin-top: 12px;
    padding: 10px 12px;
    font-size: 12.5px;
    white-space: pre-wrap;
    color: var(--warn);
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    border-radius: 10px;
  }
  #scrim {
    display: none;
    position: fixed;
    z-index: 25;
    left: 0; right: 0; bottom: 0;
    top: calc(var(--header-h) + env(safe-area-inset-top));
    border: 0;
    padding: 0;
    border-radius: 0;
    background: var(--scrim);
  }
  #btn-board-close { display: none; }

  @media (max-width: 900px) {
    #board {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      right: 0;
      bottom: 0;
      width: min(88vw, 380px);
      flex-basis: auto;
      z-index: 30;
      display: none;
      box-shadow: var(--shadow);
      padding-bottom: env(safe-area-inset-bottom);
    }
    body.show-board #board { display: flex; }
    body.show-board #scrim { display: block; }
    body.board-off #board { display: none; }
    #btn-board-close { display: inline-flex; }
  }
  @media (min-width: 901px) {
    body.board-off #board { display: none; }
  }
  @media (max-width: 640px) {
    #topbar { padding: 0 10px; gap: 8px; }
    #status-text {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .wide { display: none; }
    .narrow { display: inline; }
    #log { padding: 16px 16px 8px; }
    .dock { padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
    button.ghost, #send, #stop, .icon-btn, .ev .toggle { min-width: 40px; min-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <header id="topbar">
    <p class="brand">
      <span class="mark" aria-hidden="true">yk</span>
      yk-tako
    </p>
    <div id="status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">就绪</span>
    </div>
    <div class="top-actions">
      <button id="btn-board" class="ghost" type="button" aria-expanded="true" aria-controls="board" aria-label="显示或隐藏任务看板" title="显示或隐藏任务看板">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM9 5v14M4 10h5M4 14h5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
        <span class="wide">看板</span>
      </button>
      <button id="btn-new" class="ghost" type="button" aria-label="新会话" title="换一个新会话，不继承当前上下文">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
        <span class="wide">新会话</span>
      </button>
    </div>
  </header>

  <div id="workspace">
    <section id="chat" aria-label="对话">
      <div id="log"></div>

      <div class="dock">
        <section id="approval" class="hidden" role="alertdialog" aria-modal="true" aria-labelledby="approval-title" aria-describedby="approval-info" aria-live="assertive">
          <div class="approval-head">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5h4v14h-4zM4 8h4v8H4z" fill="currentColor"/></svg>
            <h2 id="approval-title">需要你的决定</h2>
          </div>
          <div id="approval-info" class="approval-info" tabindex="0"></div>
          <div class="approval-actions">
            <button id="btn-approve" class="primary" type="button">批准执行</button>
            <button id="btn-reject" class="danger" type="button">拒绝</button>
          </div>
        </section>

        <form id="composer" autocomplete="off">
          <div class="composer-box">
            <label class="visually-hidden" for="input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">输入消息</label>
            <textarea id="input" rows="1" placeholder="说点什么…" aria-label="输入消息"></textarea>
            <button id="send" class="primary" type="submit" aria-label="发送">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.2 19 5.2l-5.4 13.2-2.4-5.6L4.5 12.2z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><path d="m11.4 12.6 7.6-7.4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
              <span class="wide">发送</span>
            </button>
            <button id="stop" class="danger hidden" type="button" aria-label="停止">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
              <span class="wide">停止</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <aside id="board" aria-label="任务看板">
      <div class="board-head">
        <h2>任务看板</h2>
        <button id="btn-board-close" class="icon-btn ghost" type="button" aria-label="关闭看板">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="board-body" class="board-body"><div class="board-empty">还没有任务</div></div>
    </aside>
  </div>
  <button id="scrim" type="button" aria-label="关闭看板"></button>

<script>
// 会话 id 存 localStorage：刷新页面不丢会话（服务端进程内存，重启即丢）。
let sessionId = localStorage.yktakoSession || (localStorage.yktakoSession = crypto.randomUUID());
const state = {
  busy: false,
  pendingApproval: null,
  deciding: false,
  controller: null,
  // 新会话时递增。进行中的 send 发现代数变了就不再改界面，避免「已停止」写回新会话。
  turnGen: 0,
  runID: '',
  lastSeq: 0,
  userStop: false,
  // 本页已经把用户消息画出来时，不再把 start 帧再画一遍。
  localEcho: false,
};
// 与 config.agentName 一致。主 agent 不打名字，只有子代理才标。
const ROOT_AGENT = 'yk-tako';

const log = document.getElementById('log');

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function isNearBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
}
function append(node) {

  log.appendChild(node);
  if (working.parentNode === log) log.appendChild(working);
  if (stick) log.scrollTop = log.scrollHeight;
}

}

// 极简 markdown：代码围栏、标题、列表、引用、行内码、链接。
// 节点一律 textContent，模型输出不进 innerHTML。
function inlineNodes(text) {
  const nodes = [];
  const re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*)|(\[[^\]\n]+\]\(https?:\/\/[^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) nodes.push(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0];
    if (tok[0] === '`') {
      nodes.push(el('code', '', tok.slice(1, -1)));
    } else if (tok.startsWith('**')) {
      nodes.push(el('strong', '', tok.slice(2, -2)));
    } else if (tok[0] === '*') {
      nodes.push(el('em', '', tok.slice(1, -1)));
    } else {
      const parts = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(tok);
      const a = el('a', '', parts[1]);
      a.href = parts[2];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      nodes.push(a);
    }
    last = m.index + tok.length;
  }
  if (last < text.length) nodes.push(document.createTextNode(text.slice(last)));
  return nodes;
}

function renderMarkdown(text) {
  const frag = document.createDocumentFragment();
  const lines = text.split('\n');
  const fence = (l) => l.trim().startsWith('```');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (fence(line)) {
      const buf = [];
      i++;
      while (i < lines.length && !fence(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const pre = el('pre');
      pre.appendChild(el('code', '', buf.join('\n')));
      frag.appendChild(pre);
      continue;
    }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) {
      const heading = el('h' + Math.min(h[1].length + 1, 4));
      heading.append(...inlineNodes(h[2]));
      frag.appendChild(heading);
      i++;
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const ul = el('ul');
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        const li = el('li');
        li.append(...inlineNodes(lines[i].replace(/^\s*[-*]\s+/, '')));
        ul.appendChild(li);
        i++;
      }
      frag.appendChild(ul);
      continue;
    }
    if (/^\s*\d+[.、)]\s+/.test(line)) {
      const ol = el('ol');
      while (i < lines.length && /^\s*\d+[.、)]\s+/.test(lines[i])) {
        const li = el('li');
        li.append(...inlineNodes(lines[i].replace(/^\s*\d+[.、)]\s+/, '')));
        ol.appendChild(li);
        i++;
      }
      frag.appendChild(ol);
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      const quote = el('blockquote');
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      quote.append(...inlineNodes(buf.join('\n')));
      frag.appendChild(quote);
      continue;
    }
    if (line.trim() === '') { i++; continue; }
    const buf = [line];
    i++;
    while (
      i < lines.length &&
      lines[i].trim() !== '' &&
      !fence(lines[i]) &&
      !/^(#{1,4})\s+/.test(lines[i]) &&
      !/^\s*[-*]\s+/.test(lines[i]) &&
      !/^\s*\d+[.、)]\s+/.test(lines[i]) &&
      !/^\s*>\s?/.test(lines[i])
    ) { buf.push(lines[i]); i++; }
    const p = el('p');
    buf.forEach((l, idx) => {
      if (idx) p.appendChild(document.createElement('br'));
      p.append(...inlineNodes(l));
    });
    frag.appendChild(p);
  }
  return frag;
}

function dropEmptyHint() {
  const hint = document.getElementById('empty-hint');
  if (hint && hint.parentNode) hint.remove();
}
// 空态只在脚本里画一份：会话号写在会被删掉的节点上时，「新会话」会在清空之前抛错。
function showEmpty() {
  const hint = el('div', 'empty');
  hint.id = 'empty-hint';
  const mark = el('div', 'mark mark-lg', 'yk');
  mark.setAttribute('aria-hidden', 'true');
  const meta = el('p', 'hint-meta');
  meta.append(document.createTextNode('会话 '), el('span', '', sessionId.slice(0, 8)));
  hint.append(
    mark,
    el('h1', '', '会话已就绪'),
    el('p', '', '对话记录保存在服务端。刷新页面后会从服务端加载。'),
    el('p', '', '要彻底重开，用右上角的新会话。'),
    meta,
  );
  log.appendChild(hint);
}
function agentTag(agent) {
  if (!agent || agent === ROOT_AGENT) return null;
  return el('span', 'who', agent);
}
function appendUser(text) {
  dropEmptyHint();
  const wrap = el('div', 'msg user');
  wrap.appendChild(el('div', 'bubble', text));
  append(wrap);
}
const openBubbles = new Map();
function appendAssistant(text, agent) {
  dropEmptyHint();
  const wrap = el('div', 'msg assistant');
  const tag = agentTag(agent);
  if (tag) wrap.appendChild(tag);
  const md = el('div', 'md');
  md.appendChild(renderMarkdown(text));
  wrap.appendChild(md);
  append(wrap);
  return wrap;
}
function renderMessage(ev) {
  if (ev.failed) {
    const old = openBubbles.get(ev.seq);
    if (old) old.remove();
    openBubbles.delete(ev.seq);
    appendError(ev.text || '模型没写完，请再发一次');
    return;
  }
  let wrap = openBubbles.get(ev.seq);
  if (!wrap) {
    wrap = appendAssistant(ev.text, ev.agent);
    openBubbles.set(ev.seq, wrap);
  } else {
    const md = wrap.querySelector('.md');
    md.replaceChildren(renderMarkdown(ev.text || ''));
  }
  if (!ev.partial) {
    openBubbles.delete(ev.seq);
  }
}
function foldIfTall(row, out) {
  requestAnimationFrame(() => {
    if (out.scrollHeight > out.clientHeight + 4) {
      const toggle = el('button', 'toggle', '展开');
      toggle.type = 'button';
      toggle.onclick = () => {
        const open = out.classList.toggle('expanded');
        toggle.textContent = open ? '收起' : '展开';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      row.appendChild(toggle);
    }
  });
}
function appendToolCall(calls, agent) {
  dropEmptyHint();
  const row = el('div', 'ev');
  row.appendChild(svgIcon(ICON.out));
  const tag = agentTag(agent);
  if (tag) row.appendChild(tag);
  row.appendChild(el('span', '', '调用'));
  (calls || []).forEach((c) => {
    row.appendChild(el('span', 'chip', (c && c.name) || '工具'));
    if (c && c.args) {
      const out = el('div', 'out', c.args);
      row.appendChild(out);
      foldIfTall(row, out);
    }
  });
  append(row);
}
function appendToolResult(name, text, agent) {
  dropEmptyHint();
  const row = el('div', 'ev');
  row.appendChild(svgIcon(ICON.back));
  const tag = agentTag(agent);
  if (tag) row.appendChild(tag);
  row.appendChild(el('span', 'chip', name || '工具'));
  const out = el('div', 'out', text);
  row.appendChild(out);
  append(row);
  foldIfTall(row, out);
}
function appendNote(text) {
  dropEmptyHint();
  append(el('div', 'ev note', text));
}
function appendError(text) {
  dropEmptyHint();
  append(el('div', 'ev error', '出错了：' + text));
}

// 看板原文按行样式化，不截断正文。行首符号只是状态码，界面改用文字标签。
const BOARD_STATE = {
  '✅': ['done', '完成'],
  '🔄': ['run', '进行中'],
  '⏳': ['wait', '待办'],
};
function renderBoard(text) {
  boardBody.textContent = '';
  const lines = String(text || '').split('\n');
  let warn = null;
  let title = null;
  lines.forEach((line) => {
    // 去掉变异选择符，避免 ✅/🔄 带不带 FE0F 对不上状态表。
    const normalized = line.replace(/\uFE0F/g, '');
    // u 标志：🔄 在辅助平面，没有 u 时字符类对不上，进行中会原样漏出去。
    const task = /^\s*([✅🔄⏳])\s*#(\S+)\s+(.*)$/u.exec(normalized);
    if (task && BOARD_STATE[task[1]]) {
      const [cls, label] = BOARD_STATE[task[1]];
      const row = el('div', 'board-task' + (task[1] === '✅' ? ' done' : ''));
      row.appendChild(el('span', 'state ' + cls, label));
      row.appendChild(el('span', 'tid', '#' + task[2]));
      row.appendChild(el('span', 'subject', task[3]));
      boardBody.appendChild(row);
      return;
    }
    if (/^📋/u.test(normalized)) {
      const count = /（([^）]+)）/.exec(normalized);
      // 面板标题已经是「任务看板」。这里只留进度；空板交给下面的占位。
      if (count && count[1] !== '空') title = el('div', 'board-meta', count[1]);
      return;
    }
    if (/^⚠️/.test(line)) {
      warn = el('div', 'board-warn', line.replace(/^⚠️\s*/, ''));
      return;
    }
    if (warn) { warn.textContent += '\n' + line; return; }
    if (line.trim() === '') return;
    boardBody.appendChild(el('div', 'board-receipt', line));
  });
  if (title) boardBody.insertBefore(title, boardBody.firstChild);
  if (warn) boardBody.appendChild(warn);
  if (!boardBody.childNodes.length) boardBody.appendChild(el('div', 'board-empty', '还没有任务'));
  if (window.matchMedia('(max-width: 900px)').matches && !document.body.classList.contains('show-board')) {
    btnBoard.classList.add('updated');
  }
}

function approvalRow(k, v, mono) {
  const row = el('div', 'row');
  const key = el('span', 'k', k);
  const val = el('span', 'v' + (mono ? ' mono' : ''), v);
  row.append(key, val);
  return row;
}
let approvalReturn = null;
function showApproval(a) {
  state.pendingApproval = a.id;
  approvalInfo.textContent = '';
  approvalInfo.appendChild(approvalRow('工具', a.tool || '（未标注）'));
  approvalInfo.appendChild(approvalRow('参数', a.args || '—', true));
  if (a.message) approvalInfo.appendChild(approvalRow('说明', a.message));
  document.getElementById('btn-approve').disabled = false;
  document.getElementById('btn-reject').disabled = false;
  approvalReturn = document.activeElement;
  approvalBox.classList.remove('hidden');
  document.getElementById('btn-approve').focus();
}
function approvalFocusables() {
  return [approvalInfo, document.getElementById('btn-approve'), document.getElementById('btn-reject')]
    .filter((node) => node && !node.disabled);
}
function hideApproval() {
  approvalBox.classList.add('hidden');
  if (approvalReturn && typeof approvalReturn.focus === 'function') approvalReturn.focus();
  approvalReturn = null;
}
async function decide(decision) {
  if (!state.pendingApproval || state.deciding) return;
  const requestId = state.pendingApproval;
  state.deciding = true;
  document.getElementById('btn-approve').disabled = true;
  document.getElementById('btn-reject').disabled = true;
  try {
    const resp = await fetch('/api/approval', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, requestId, decision }),
    });
    if (!resp.ok) {
      appendError('审批回执失败：' + resp.status + ' ' + (await resp.text()));
      document.getElementById('btn-approve').disabled = false;
      document.getElementById('btn-reject').disabled = false;
      return;
    }
    appendNote(decision === 'approve' ? '已批准，继续执行' : '已拒绝，模型会收到说明');
    state.pendingApproval = null;
    hideApproval();
  } catch (e) {
    appendError('审批回执没发出去：' + e);
    document.getElementById('btn-approve').disabled = false;
    document.getElementById('btn-reject').disabled = false;
  } finally {
    state.deciding = false;
  }
}

function setBusy(busy) {
  state.busy = busy;
  sendBtn.disabled = busy;
  sendBtn.classList.toggle('hidden', busy);
  stopBtn.classList.toggle('hidden', !busy);
  if (busy) {
    setStatus('正在工作…', 'busy');
    dropEmptyHint();
    if (working.parentNode !== log) log.appendChild(working);
    working.classList.remove('hidden');
    if (isNearBottom()) log.scrollTop = log.scrollHeight;
  } else {
    working.classList.add('hidden');
    if (statusEl.classList.contains('busy')) setStatus('就绪');
  }
}
function renderEvent(ev) {
  switch (ev.kind) {
    case 'message': renderMessage(ev); break;
    case 'tool_call': appendToolCall(ev.toolCalls, ev.agent); break;
    case 'tool_result': appendToolResult(ev.toolName, ev.text, ev.agent); break;
    case 'board': renderBoard(ev.text); break;
    case 'compact':
      appendNote(ev.text || '正在压缩');
      break;
    case 'approval': showApproval(ev.approval || {}); break;
    case 'error': appendError(ev.text); setStatus('出错了', 'err'); break;
    case 'stop':
      state.userStop = true;
      appendNote('已停止');
      setStatus('已停止');
      break;
    case 'start':
      if (!state.localEcho && ev.text) appendUser(ev.text);
      break;
    case 'complete':
    case 'approval_result':
      break;
  }
}

// 历史懒加载状态
const history = {
  loading: false,
  done: false,
  cursor: '',
  runs: new Set(),
};

// 滚到顶时加载更早的历史
log.addEventListener('scroll', () => {
  if (log.scrollTop < 50 && !history.loading && !history.done) {
    loadHistory();
  }
});

async function loadHistory() {
  if (history.loading || history.done) return;
  history.loading = true;
  try {
    const params = new URLSearchParams({ session: sessionId });
    if (history.cursor) params.set('before', history.cursor);
    const resp = await fetch('/api/session/history?' + params);
    if (!resp.ok) throw new Error(resp.status);
    const page = await resp.json();
    renderHistoryPage(page.runs);
    history.cursor = page.nextCursor || '';
    history.done = !page.nextCursor;
  } catch (e) {
    console.error('加载历史失败', e);
  } finally {
    history.loading = false;
  }
}

function renderHistoryPage(runs) {
  // runs 按 created_at 降序，画的时候要反过来（最早的在上面）
  for (let i = runs.length - 1; i >= 0; i--) {
    const run = runs[i];
    if (history.runs.has(run.runId)) continue;
    history.runs.add(run.runId);
    const scrollBottom = log.scrollHeight - log.scrollTop;
    for (const ev of run.events) {
      renderHistoryEvent(ev);
    }
    log.scrollTop = log.scrollHeight - scrollBottom;
  }
}

function renderHistoryEvent(ev) {
  // 历史回放：不弹审批卡，不改状态
  switch (ev.kind) {
    case 'start':
      if (ev.text) appendUser(ev.text);
      break;
    case 'message':
      appendAssistant(ev.text, ev.agent);
      break;
    case 'tool_call':
      appendToolCall(ev.toolCalls, ev.agent);
      break;
    case 'tool_result':
      appendToolResult(ev.toolName, ev.text, ev.agent);
      break;
    case 'board':
      renderBoard(ev.text);
      break;
    case 'compact':
      appendNote(ev.text || '正在压缩');
      break;
    case 'error':
      appendError(ev.text);
      break;
    case 'stop':
      appendNote('已停止');
      break;
    case 'approval':
    case 'approval_result':
    case 'complete':
      break;
  }
}

function startNewSession() {
  state.turnGen++;
  const run = state.runID;
  if (state.controller) {
    const current = state.controller;
    state.controller = null;
    current.abort();
  }
  if (run) {
    fetch('/api/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, run }),
    }).catch(() => {});
  }
  state.runID = '';
  state.lastSeq = 0;
  state.userStop = false;
  state.localEcho = false;
  sessionId = crypto.randomUUID();
  localStorage.yktakoSession = sessionId;
  state.pendingApproval = null;
  state.deciding = false;
  hideApproval();
  setBusy(false);
  log.textContent = '';
  showEmpty();
  boardBody.textContent = '';
  boardBody.appendChild(el('div', 'board-empty', '还没有任务'));
  btnBoard.classList.remove('updated');
  input.value = '';
  input.style.height = 'auto';
  setStatus('就绪');
  input.focus();
  // 重置历史状态
  history.loading = false;
  history.done = false;
  history.cursor = '';
  history.runs.clear();
}
async function send() {
  const message = input.value.trim();
  if (!message || state.busy) return;
  const gen = state.turnGen;
  input.value = '';
  input.style.height = 'auto';
  appendUser(message);
  setBusy(true);
  state.controller = new AbortController();
  state.runID = '';
  state.lastSeq = 0;
  state.userStop = false;
  state.gapRetried = false;
  state.localEcho = true;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message }),
      signal: state.controller.signal,
    });
    if (gen !== state.turnGen) return;
    if (!resp.ok) {
      appendError('请求失败：' + resp.status + ' ' + (await resp.text()));
      setStatus('出错了', 'err');
      return;
    }
    await readEventStream(resp, gen);
    if (gen !== state.turnGen) return;
    if (state.userStop) setStatus('已停止');
    else if (!statusEl.classList.contains('err')) setStatus('就绪', 'done');
  } catch (e) {
    if (gen !== state.turnGen) return;
    if (e.name === 'AbortError') return;
    if (state.runID && !state.userStop) {
      try {
        await pullStream(state.lastSeq, gen);
        if (gen !== state.turnGen) return;
        if (state.userStop) setStatus('已停止');
        else if (!statusEl.classList.contains('err')) setStatus('就绪', 'done');
        return;
      } catch (e2) {
        if (gen !== state.turnGen || e2.name === 'AbortError') return;
        appendError('连接断了：' + e2);
        setStatus('连接断了', 'err');
        return;
      }
    }
    appendError('连接断了：' + e);
    setStatus('连接断了', 'err');
  } finally {
    if (gen !== state.turnGen) return;
    state.controller = null;
    state.pendingApproval = null;
    approvalBox.classList.add('hidden');
    setBusy(false);
    if (state.userStop) setStatus('已停止');
  }
}
function streamURL(from) {
  return '/api/chat/stream?run=' + encodeURIComponent(state.runID) + '&from=' + (from || 0);
}
async function pullStream(from, gen) {
  const resp = await fetch(streamURL(from), { signal: state.controller.signal });
  if (gen !== state.turnGen) return;
  if (!resp.ok) throw new Error('续传失败：' + resp.status + ' ' + (await resp.text()));
  await readEventStream(resp, gen);
}
async function readEventStream(resp, gen) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    if (gen !== state.turnGen) return;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const line = frame.split('\n').find((l) => l.startsWith('data: '));
      if (!line) continue;
      let ev;
      try { ev = JSON.parse(line.slice(6)); } catch (e) { console.error(e); continue; }
      if (ev.run) state.runID = ev.run;
      if (ev.seq && !ev.partial && state.lastSeq && ev.seq > state.lastSeq + 1) {
        appendNote('序号从 ' + state.lastSeq + ' 跳到了 ' + ev.seq + '，从上次连续的位置再读');
        if (!state.gapRetried) {
          state.gapRetried = true;
          try { await reader.cancel(); } catch (e) { /* 放弃这一条，改走续传 */ }
          await pullStream(state.lastSeq, gen);
        }
        return;
      }
      if (ev.seq && !ev.partial && !ev.failed) state.lastSeq = ev.seq;
      renderEvent(ev);
    }
  }
}

function boardIsNarrow() {
  return window.matchMedia('(max-width: 900px)').matches;
}
function syncBoardAria() {
  const open = boardIsNarrow()
    ? document.body.classList.contains('show-board')
    : !document.body.classList.contains('board-off');
  btnBoard.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function closeBoard() {
  if (boardIsNarrow()) document.body.classList.remove('show-board');
  else document.body.classList.add('board-off');
  syncBoardAria();
}
function toggleBoard() {
  if (boardIsNarrow()) {
    document.body.classList.toggle('show-board');
    if (document.body.classList.contains('show-board')) btnBoard.classList.remove('updated');
  } else {
    document.body.classList.toggle('board-off');
  }
  syncBoardAria();
}

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  send();
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
function syncPlaceholder() {
  const narrow = window.matchMedia('(max-width: 640px)').matches;
  input.placeholder = narrow ? '说点什么…' : '说点什么…（Enter 发送，Shift+Enter 换行）';
}
syncPlaceholder();
window.matchMedia('(max-width: 640px)').addEventListener('change', syncPlaceholder);
// 后来打开的页面不自己发消息，但会话里可能已经有一轮。从 0 把已落盘的帧补上。
async function attachLive() {
  let view;
  try {
    const resp = await fetch('/api/session?id=' + encodeURIComponent(sessionId));
    if (!resp.ok) return;
    view = await resp.json();
  } catch (e) {
    return;
  }
  if (!view || !view.liveRun || state.busy) return;
  state.runID = view.liveRun;
  state.lastSeq = 0;
  state.localEcho = false;
  state.controller = new AbortController();
  // 正在跑的 run 不画进历史，避免和 from=0 的回放叠成两份
  history.runs.add(view.liveRun);
  const gen = state.turnGen;
  setBusy(true);
  try {
    await pullStream(0, gen);
    if (gen !== state.turnGen) return;
    if (state.userStop) setStatus('已停止');
    else if (!statusEl.classList.contains('err')) setStatus('就绪', 'done');
  } catch (e) {
    if (gen !== state.turnGen || e.name === 'AbortError') return;
    appendError('没接上正在跑的一轮：' + e);
  } finally {
    if (gen !== state.turnGen) return;
    state.controller = null;
    setBusy(false);
  }
}
(async () => {
  await attachLive();
  await loadHistory();
  log.scrollTop = log.scrollHeight;
})();
stopBtn.addEventListener('click', () => {
  if (!state.runID) return;
  fetch('/api/stop', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, run: state.runID }),
  }).catch((e) => appendError('停止没发出去：' + e));
});
document.getElementById('btn-approve').onclick = () => decide('approve');
document.getElementById('btn-reject').onclick = () => decide('reject');
document.getElementById('btn-new').addEventListener('click', () => {
  if (state.busy && !confirm('有一轮正在跑，换新会话会中止它，继续吗？')) return;
  startNewSession();
});
approvalBox.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || approvalBox.classList.contains('hidden')) return;
  const items = approvalFocusables();
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});
document.addEventListener('focusin', (e) => {
  if (approvalBox.classList.contains('hidden') || approvalBox.contains(e.target)) return;
  // 停止、新会话、看板要能在审批挂起时点到，不把焦点抢回去。
  if (e.target.closest('#stop, #btn-new, #btn-board, #btn-board-close, #scrim')) return;
  const approve = document.getElementById('btn-approve');
  const target = approve && !approve.disabled ? approve : approvalFocusables()[0];
  if (target) target.focus();
});
btnBoard.addEventListener('click', toggleBoard);
document.getElementById('btn-board-close').addEventListener('click', closeBoard);
scrim.addEventListener('click', closeBoard);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!approvalBox.classList.contains('hidden')) return;
  const open = boardIsNarrow()
    ? document.body.classList.contains('show-board')
    : false;
  if (open) closeBoard();
});
window.matchMedia('(max-width: 900px)').addEventListener('change', syncBoardAria);
syncBoardAria();
showEmpty();
input.focus();
</script>
</body>
</html>
